$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
toolchains:
  default: 'node'
stack: 'backend'

project:
  name: 'api'
  description: 'Express API — single source of truth untuk semua client'

dependsOn:
  - 'shared'
  - 'db'
  - 'ai'

tasks:
  dev:
    command: 'pnpm exec tsx watch src/main.ts'
    preset: 'server'
    deps:
      - 'db:generate'

  start:
    command: 'node dist/main.js'
    deps:
      - 'build'
    preset: 'server'
