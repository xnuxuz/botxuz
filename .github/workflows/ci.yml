name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # moon ci butuh riwayat untuk menghitung project yang affected.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # Hanya build/test project yang terpengaruh perubahan — hemat CI minutes.
      - run: moon ci --base origin/${{ github.base_ref || 'main' }}
